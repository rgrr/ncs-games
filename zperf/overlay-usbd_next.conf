CONFIG_USB_DEVICE_STACK_NEXT=y

# next-ncm does not work well with the static-size buffers
CONFIG_NET_PKT_BUF_RX_DATA_POOL_SIZE=10000
CONFIG_NET_PKT_BUF_TX_DATA_POOL_SIZE=10000
CONFIG_NET_BUF_VARIABLE_DATA_SIZE=y

# merker
#CONFIG_UDC_DRIVER=y
#CONFIG_UDC_NRF=y

# not used by application stack sizes
CONFIG_USBC_STACK_SIZE=6000
CONFIG_USBD_THREAD_STACK_SIZE=6000
CONFIG_USB_WORKQUEUE_STACK_SIZE=6000
CONFIG_USB_NRFX_WORK_QUEUE_STACK_SIZE=6000

CONFIG_LOG=y
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_USBD_CDC_NCM_LOG_LEVEL_WRN=y
CONFIG_USBD_CDC_ECM_LOG_LEVEL_WRN=y
